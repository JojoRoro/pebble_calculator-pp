name: Build Pebble app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run deterministic parser/evaluator tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            tests/test_logic.c src/c/calculator.c src/c/parser.c \
            -o /tmp/minuspp-tests
          /tmp/minuspp-tests

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Pebble tooling
        run: |
          uv tool install pebble-tool
          pebble sdk install latest

      - name: Install Pebble package dependencies
        run: npm install

      - name: Build PBW
        run: pebble build

      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: minuspp-pbw
          path: build/*.pbw
          if-no-files-found: error
